<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Manager</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dfe2e8; --text:#1d2330; --mute:#667085; --brand:#1f5eff; --ok:#12805c; --warn:#b26a00; --bad:#c0302b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; position:sticky; top:0; z-index:5; }
  header b { font-size:17px; }
  header small { color:var(--mute); }
  nav { display:flex; gap:6px; overflow-x:auto; padding:8px 14px; background:#fff; border-bottom:1px solid var(--line); }
  nav button { white-space:nowrap; border:1px solid var(--line); background:#fff; border-radius:18px; padding:7px 14px; font-size:14px; cursor:pointer; }
  nav button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  main { padding:14px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  h2 { margin:0 0 10px; font-size:18px; } h3 { margin:14px 0 8px; font-size:15px; }
  label { display:block; font-size:13px; color:var(--mute); margin:10px 0 3px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:60px; }
  button.btn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px 16px; font:inherit; cursor:pointer; margin:8px 6px 0 0; }
  button.btn.sec { background:#fff; color:var(--text); border:1px solid var(--line); }
  button.btn.red { background:var(--bad); }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0 12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mute); font-weight:600; font-size:13px; white-space:nowrap; }
  tr.click { cursor:pointer; } tr.click:hover { background:#f0f4ff; }
  .tw { overflow-x:auto; }
  .badge { display:inline-block; padding:2px 9px; border-radius:12px; font-size:12px; font-weight:600; }
  .working { background:#e3f5ee; color:var(--ok); } .repairable { background:#fff1d9; color:var(--warn); } .damaged { background:#fde5e4; color:var(--bad); } .unassigned { background:#eceff3; color:#475467; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; } .stat b { font-size:24px; display:block; } .stat span { color:var(--mute); font-size:13px; }
  .mute { color:var(--mute); } .err { color:var(--bad); } .ok { color:#15803d; } .num { text-align:right; }
  .photo { max-width:100%; max-height:260px; border-radius:8px; border:1px solid var(--line); }
  #reader { width:100%; max-width:420px; margin:0 auto; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:8px; display:none; z-index:20; max-width:90%; }
  #toast.bad { background:var(--bad); }
  :root { --lbl:50mm; }
  .labels { display:block; }
  .sheet { display:grid; grid-template-columns:repeat(3,var(--lbl)); grid-auto-rows:var(--lbl); gap:5mm; justify-content:center; margin:0 auto 12px; padding:6px 0; }
  .label { box-sizing:border-box; width:var(--lbl); height:var(--lbl); border:0.2mm dashed #999; padding:1.5mm 1mm; text-align:center; background:#fff; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:space-between; page-break-inside:avoid; break-inside:avoid; }
  .label .ttl { font-weight:700; font-size:9pt; letter-spacing:.3px; line-height:1.1; }
  .label .qr { display:flex; justify-content:center; width:30mm; height:30mm; } .label .qr img, .label .qr canvas { width:30mm !important; height:30mm !important; }
  .label b { display:block; font-size:10pt; line-height:1.1; }
  .label span.ln { font-size:7pt; display:block; line-height:1.15; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; max-height:130px; overflow:auto; margin:4px 0 10px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font-size:14px; cursor:pointer; margin:0; width:auto; color:inherit; }
  .chip small { color:var(--mute); } .chip.on { background:var(--brand); color:#fff; border-color:var(--brand); } .chip.on small { color:#dbe7ff; }
  .chk { display:inline-block; margin:3px 14px 3px 0; font-size:14px; color:var(--fg,#222); } .chk input { width:auto; margin-right:5px; }
  .roomlist { max-height:220px; overflow:auto; border:1px solid #ddd; border-radius:8px; padding:6px 10px; }
  @media (max-width:560px) { .sheet { grid-template-columns:repeat(2,var(--lbl)); } }
  @media print {
    @page { size:A4; margin:0; }
    html, body { background:#fff; margin:0; padding:0; } header, nav, .noprint, #toast { display:none !important; }
    main { padding:0; max-width:none; margin:0; } .card { border:0; padding:0; margin:0; }
    .sheet { grid-template-columns:repeat(3,var(--lbl)); width:210mm; height:296mm; box-sizing:border-box; margin:0; padding:13mm 0 0; gap:5mm; align-content:start; page-break-after:always; break-after:page; overflow:hidden; }
    .sheet:last-child { page-break-after:auto; break-after:auto; }
  }

  /* v10 colour theme and charts */
  :root { --bg:#eef2fb; --brand:#2563eb; --ok:#15803d; --warn:#b45309; --bad:#be123c; }
  header { background:linear-gradient(90deg,#1e3a8a,#2563eb); color:#fff; border-bottom:0; } header small { color:#dbe7ff; }
  nav { background:#f8faff; } nav button { border-color:#c7d6fb; color:#1e3a8a; } nav button.on { background:#2563eb; border-color:#2563eb; color:#fff; }
  .card { border-top:3px solid #c7d6fb; } h2 { color:#1e3a8a; }
  .stat { border-left:5px solid var(--brand); } .stat:nth-child(5n+2) { border-left-color:#7c3aed; } .stat:nth-child(5n+3) { border-left-color:#16a34a; } .stat:nth-child(5n+4) { border-left-color:#f59e0b; } .stat:nth-child(5n+5) { border-left-color:#e11d48; }
  button.btn.sec { border-color:#c7d6fb; color:#1e3a8a; } button.btn.sm { padding:5px 10px; font-size:13px; margin:0; }
  tr.off td { opacity:.55; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
  .donut { display:flex; align-items:center; gap:16px; flex-wrap:wrap; } .lg { font-size:13px; margin:3px 0; } .lg i, .lg2 i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .lg2 { display:flex; gap:14px; font-size:13px; margin-top:8px; }
  .hb { display:flex; flex-direction:column; gap:7px; } .hbr { display:grid; grid-template-columns:minmax(70px,150px) 1fr 54px; gap:8px; align-items:center; font-size:13px; }
  .hbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hbt { background:#eef2fb; border-radius:6px; height:16px; overflow:hidden; }
  .hbw { display:flex; height:100%; border-radius:6px; overflow:hidden; } .hbw span { display:block; height:100%; } .hbn { text-align:right; font-weight:600; }
</style>
</head>
<body>
<header><div><b>Asset Manager</b> <small id="who"></small></div><button class="btn sec" id="logout" style="display:none;margin:0">Sign out</button></header>
<nav id="nav"></nav>
<main id="view"><p class="mute">Loading...</p></main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
